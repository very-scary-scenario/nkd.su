clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      # we check git history in the tests, so:
      partial: false

steps:
  setup:
    image: nikolaik/python-nodejs:python3.12-nodejs20
    commands:
      - npm install
      - python -m venv .venv
      - . .venv/bin/activate
      - pip install 'poetry>=2.0,<3'
      - poetry install
      - poetry run ./manage.py migrate --settings=nkdsu.settings_testing
      - poetry run ./manage.py collectstatic --no-input --settings=nkdsu.settings_testing

  test:
    image: nikolaik/python-nodejs:python3.12-nodejs20
    depends_on: setup
    commands:
      - . .venv/bin/activate
      - poetry run npm run-script test

  check-migrations:
    image: nikolaik/python-nodejs:python3.12-nodejs20
    depends_on: setup
    commands:
      - . .venv/bin/activate
      - poetry run npm run-script check-migrations

  docs:
    image: nikolaik/python-nodejs:python3.12-nodejs20
    depends_on: setup
    commands:
      - . .venv/bin/activate
      - cd docs
      - poetry run make html

  black:
    image: nikolaik/python-nodejs:python3.12-nodejs20
    depends_on: setup
    commands:
      - . .venv/bin/activate
      - poetry run npm run-script lint-black

  flake8:
    image: nikolaik/python-nodejs:python3.12-nodejs20
    depends_on: setup
    commands:
      - . .venv/bin/activate
      - poetry run npm run-script lint-flake8

  mypy:
    image: nikolaik/python-nodejs:python3.12-nodejs20
    depends_on: setup
    commands:
      - . .venv/bin/activate
      - poetry run npm run-script lint-mypy

  eslint:
    image: nikolaik/python-nodejs:python3.12-nodejs20
    depends_on: setup
    commands:
      - . .venv/bin/activate
      - poetry run npm run-script lint-js
