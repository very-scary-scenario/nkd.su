{% extends parent %}

{% block content %}

  <h2>{{ object.name }}</h2>

  <p class="subheading">
    curated by <a href="{{ object.user.profile.get_absolute_url }}">{{ object.user }}</a>
  </p>

  <ul class="tracks">
    {% include "include/tracklist.html" with tracks=object.playlist %}
  </ul>

{% endblock %}
