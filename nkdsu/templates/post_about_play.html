{% extends parent %}

{% block title %}post about this play{% endblock %}
{% block content %}

<h2>you played {{ track }}</h2>

<div class="prose">
  <dl class="post-about-play">
    <dt>Twitter:</dt>
    <dd>
      <p><input readonly type="text" value="{{ track.play_tweet_content }}"></p>
      <p><a target="_blank" href="{{ track.play_tweet_intent_url }}" class="button">post this tweet</a></p>
    </dd>

    <dt>Bluesky:</dt>
    <dd>
      <p><input readonly type="text" value="{{ track.play_bsky_content }}"></p>
      <p><a target="_blank" href="{{ track.play_bsky_intent_url }}" class="button">post this skeet</a></p>
    </dd>

    <dt>Discord:</dt>
    <dd>
      <p><input readonly type="text" value="{{ track.play_discord_content }}"></p>
    </dd>
  </dl>

  <p><a href="{% url "vote:index" %}">return home</a></p>
</div>

{% endblock %}
